
<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>ZYNEX PHARM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#f7f4f2;
    --maroon:#8a0f24;
    --maroon-d:#5c0a18;
    --maroon-l:#b4213c;
    --gold:#c9a24a;
    --gold-soft:#e3c987;
    --ink:#2a0a10;
    --ink-soft:#8a7570;
    --card-line:#efe6e1;
    --white:#ffffff;
    --shadow: 0 10px 26px rgba(110,15,34,0.10), 0 2px 8px rgba(110,15,34,0.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;
    background: var(--bg);
    color:var(--ink);
    font-family:'Helvetica Neue', Arial, sans-serif;
  }
  #app{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding-bottom: calc(74px + env(safe-area-inset-bottom));
  }

  /* ---------- header ---------- */
  .header{
    background: linear-gradient(160deg, var(--maroon-l) 0%, var(--maroon) 45%, var(--maroon-d) 100%);
    border-radius: 0 0 26px 26px;
    padding: max(16px, env(safe-area-inset-top)) 16px 18px;
    box-shadow: 0 8px 24px rgba(90,10,24,0.25);
  }
  .header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brand-logo{
    width:36px;height:36px;border-radius:50%;
    overflow:hidden;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.35);
    flex-shrink:0;
  }
  .brand-logo img{ width:100%;height:100%;object-fit:cover;display:block; }
  .brand-name{
    color:#fff;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.02em;
    line-height:1.1;
  }
  .brand-name small{
    display:block;
    font-size:9px;
    letter-spacing:0.28em;
    color: var(--gold-soft);
    font-weight:600;
    margin-top:1px;
  }
  .header-icons{ display:flex; gap:8px; }
  .icon-btn{
    width:38px;height:38px;border-radius:50%;
    background: rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.22);
    display:flex;align-items:center;justify-content:center;
    color:#fff;
    position:relative;
  }
  .icon-btn svg{ width:18px;height:18px; }
  .icon-dot{
    position:absolute; top:6px; right:7px;
    width:7px;height:7px;border-radius:50%;
    background: var(--gold-soft);
    box-shadow: 0 0 0 2px var(--maroon);
  }

  .searchbar{
    display:flex;
    align-items:center;
    gap:8px;
    background: rgba(255,255,255,0.95);
    border-radius:14px;
    padding:10px 12px;
  }
  .searchbar svg{ width:17px;height:17px; color: var(--maroon); flex-shrink:0; }
  .searchbar input{
    flex:1;
    border:none;outline:none;
    background:transparent;
    font-size:13.5px;
    color:var(--ink);
    font-family:'Helvetica Neue', Arial, sans-serif;
  }
  .searchbar input::placeholder{ color:#b3a2a8; }
  .filter-btn{
    width:30px;height:30px;border-radius:9px;
    background: linear-gradient(160deg, var(--maroon-l), var(--maroon));
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .filter-btn svg{ width:14px;height:14px; color:#fff; }

  /* ---------- lang pills ---------- */
  .langbar{
    display:flex;
    justify-content:center;
    gap:4px;
    margin: 14px 16px 0;
    background: #fff;
    border:1px solid var(--card-line);
    border-radius:999px;
    padding:4px;
  }
  .lang-btn{
    appearance:none;border:none;background:transparent;
    color:var(--ink-soft);
    font-size:11.5px;font-weight:600;letter-spacing:0.06em;
    padding:7px 0; flex:1; border-radius:999px; cursor:pointer;
    transition: all .25s ease;
  }
  .lang-btn.active{
    background: linear-gradient(135deg, var(--maroon), var(--maroon-d));
    color:#fff;
    box-shadow: 0 4px 12px rgba(110,15,34,0.28);
  }

  /* ---------- banner ---------- */
  .banner{
    margin: 14px 16px 0;
    border-radius:20px;
    background: linear-gradient(135deg, #fff 0%, #fdf8f3 100%);
    border:1px solid var(--card-line);
    box-shadow: var(--shadow);
    padding:16px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .banner-text{ flex:1; }
  .banner-title{
    font-size:13.5px;
    font-weight:700;
    color: var(--maroon);
    margin-bottom:3px;
    letter-spacing:0.01em;
  }
  .banner-sub{
    font-size:11px;
    color: var(--ink-soft);
    line-height:1.4;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .banner-sub img{ width:14px;height:14px;object-fit:contain;flex-shrink:0; }

  /* ---------- section header ---------- */
  .section{ margin: 20px 16px 10px; display:flex; align-items:baseline; justify-content:space-between; }
  .section-title{ font-size:15px; font-weight:700; color:var(--ink); }
  .section-count{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }

  /* ---------- product grid ---------- */
  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
    margin: 0 16px 6px;
  }
  .pcard{
    background:#fff;
    border:1px solid var(--card-line);
    border-radius:18px;
    box-shadow: var(--shadow);
    padding:14px 12px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    position:relative;
    transition: transform .2s ease;
  }
  .pcard:active{ transform: scale(0.97); }
  .heart-btn{
    position:absolute; top:10px; right:10px;
    width:26px;height:26px;border-radius:50%;
    background: var(--bg);
    display:flex;align-items:center;justify-content:center;
  }
  .heart-btn svg{ width:13px;height:13px; color: var(--ink-soft); transition: all .2s ease; }
  .heart-btn.liked svg{ color: var(--maroon); fill:var(--maroon); }
  .pbox{
    width:92px;height:106px;
    border-radius:14px;
    margin: 4px 0 10px;
    display:flex;align-items:center;justify-content:center;
    background:#fff;
    box-shadow: 0 8px 16px -8px rgba(90,10,24,0.25), inset 0 0 0 1px var(--card-line);
    position:relative;
    overflow:hidden;
    transform: perspective(400px) rotateX(4deg);
  }
  .pbox img{
    width:100%;height:100%;
    object-fit:contain;
    padding:6px;
  }
  .pname{ font-size:13px; font-weight:700; color:var(--ink); margin-bottom:3px; }
  .ptag{ font-size:10px; color:var(--ink-soft); line-height:1.35; }
  .grid .pcard[hidden]{ display:none; }
  .empty-state{
    display:none;
    text-align:center;
    color: var(--ink-soft);
    font-size:12.5px;
    padding: 30px 16px;
  }
  .empty-state.show{ display:block; }

  /* ---------- bottom nav ---------- */
  .navbar{
    position:fixed; left:0; right:0; bottom:0;
    background:#fff;
    border-top:1px solid var(--card-line);
    display:flex;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    box-shadow: 0 -6px 20px rgba(0,0,0,0.05);
  }
  .navitem{
    flex:1;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    color: var(--ink-soft);
    font-size:9.5px;
    font-weight:600;
    padding:4px 0;
  }
  .navitem svg{ width:19px;height:19px; }
  .navitem img{ width:19px;height:19px; object-fit:contain; }
  .navitem.active{ color: var(--maroon); }

  .footer-note{
    text-align:center;
    font-size:9px;
    letter-spacing:0.14em;
    color: var(--ink-soft);
    text-transform:uppercase;
    margin: 10px 0 4px;
  }
</style>
</head>

      var heart = document.createElement('div');
      heart.className = 'heart-btn' + (liked[p.key] ? ' liked' : '');
      heart.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>';
      heart.addEventListener('click', function(e){
        e.stopPropagation();
        liked[p.key] = !liked[p.key];
        heart.classList.toggle('liked', liked[p.key]);
        if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred('light'); } catch(e){} }
      });

      var box = document.createElement('div');
      box.className = 'pbox';
      box.innerHTML = '<img src="' + p.img + '" alt="' + p.name[lang] + '" />';

      var name = document.createElement('div');
      name.className = 'pname';
      name.textContent = p.name[lang];

      var tag = document.createElement('div');
      tag.className = 'ptag';
      tag.textContent = p.tag[lang];

      card.appendChild(heart);
      card.appendChild(box);
      card.appendChild(name);
      card.appendChild(tag);
      $grid.appendChild(card);
    });
  }

  function applySearch(){
    var q = $search.value.trim().toLowerCase();
    var visibleCount = 0;
    Array.prototype.forEach.call($grid.children, function(card){
      var match = !q || card.dataset.name.indexOf(q) !== -1;
      card.hidden = !match;
      if (match) visibleCount++;
    });
    $empty.classList.toggle('show', visibleCount === 0);
    $sectionCount.textContent = i18n[lang].count(visibleCount);
  }

  function render(){
    buildGrid();
    $sectionTitle.textContent = i18n[lang].title;
    $bannerTitle.textContent = i18n[lang].bannerTitle;
    $bannerSub.textContent = i18n[lang].bannerSub;
    $search.placeholder = i18n[lang].search;
    $empty.textContent = i18n[lang].empty;
    $navHome.textContent = i18n[lang].navHome;
    $navCatalog.textContent = i18n[lang].navCatalog;
    $navContact.textContent = i18n[lang].navContact;
    $navProfile.textContent = i18n[lang].navProfile;
    applySearch();
  }

  function setLang(l){
    lang = l;
    Array.prototype.forEach.call($langbar.children, function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === l);
    });
    render();
  }

  $langbar.addEventListener('click', function(e){
    var btn = e.target.closest('.lang-btn');
    if (!btn) return;
    setLang(btn.getAttribute('data-lang'));
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.selectionChanged(); } catch(e){} }
  });

  $search.addEventListener('input', applySearch);

  var $navItems = document.querySelectorAll('.navitem');
  $navItems.forEach(function(item){
    item.addEventListener('click', function(){
      $navItems.forEach(function(i){ i.classList.remove('active'); });
      item.classList.add('active');
      if (item.dataset.nav === 'catalog') {
        document.querySelector('.section').scrollIntoView({behavior:'smooth', block:'start'});
      }
      if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.selectionChanged(); } catch(e){} }
    });
  });

  setLang('uz');
})();
</script>
</body>
</html>
