<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>ZYNEX PHARMA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#ffffff;
    --bg-soft:#f7f4f2;
    --maroon:#6e0f22;
    --maroon-d:#4a0a17;
    --gold:#c9a24a;
    --gold-soft:#e3c987;
    --ink:#2a0a10;
    --ink-soft:#8a7570;
    --card-line:#efe6e1;
    --shadow: 0 10px 30px rgba(110,15,34,0.08), 0 2px 8px rgba(110,15,34,0.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    background: var(--bg);
    color:var(--ink);
    font-family:'Helvetica Neue', Arial, sans-serif;
    overflow:hidden;
  }
  #app{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: max(20px, env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));
    position:relative;
  }

  /* ---------- top bar: language switch ---------- */
  .langbar{
    width:100%;
    max-width:320px;
    display:flex;
    justify-content:center;
    gap:4px;
    margin-bottom:20px;
    background: var(--bg-soft);
    border:1px solid var(--card-line);
    border-radius:999px;
    padding:4px;
    z-index:2;
  }
  .lang-btn{
    appearance:none;border:none;
    background:transparent;
    color:var(--ink-soft);
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.06em;
    padding:8px 0;
    flex:1;
    border-radius:999px;
    cursor:pointer;
    transition: all .25s ease;
  }
  .lang-btn.active{
    background: linear-gradient(135deg, var(--maroon), var(--maroon-d));
    color:#fff;
    box-shadow: 0 4px 14px rgba(110,15,34,0.28);
  }

  /* ---------- logo ---------- */
  .logo-wrap{
    display:flex;flex-direction:column;align-items:center;
    margin: 4px 0 18px;
    z-index:2;
  }
  .logo-ring{
    width:104px;height:104px;border-radius:50%;
    overflow:hidden;
    box-shadow: var(--shadow), 0 0 0 4px #fff, 0 0 0 5px var(--card-line);
    background:#fff;
  }
  .logo-ring img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }

  /* ---------- catalog title ---------- */
  .catalog-title{
    font-size:13px;
    font-weight:700;
    letter-spacing:0.16em;
    color: var(--maroon);
    text-transform:uppercase;
    margin-bottom:18px;
    z-index:2;
  }

  /* ---------- 3D stage ---------- */
  .stage{
    width:100%;
    max-width:340px;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:2;
    min-height:260px;
  }
  .stage-card{
    width:100%;
    background:#fff;
    border:1px solid var(--card-line);
    border-radius:28px;
    box-shadow: var(--shadow);
    padding:30px 20px 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .perspective{
    width:190px;
    height:230px;
    perspective:900px;
    margin-bottom:22px;
  }
  .box3d{
    width:100%;height:100%;
    position:relative;
    transform-style:preserve-3d;
    animation: idleSpin 9s ease-in-out infinite;
  }
  @keyframes idleSpin{
    0%,100%{ transform: rotateY(-14deg) rotateX(4deg); }
    50%{ transform: rotateY(14deg) rotateX(4deg); }
  }
  .face{
    position:absolute;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
    backface-visibility:hidden;
  }
  .face-front{
    width:190px;height:230px;
    left:0;top:0;
    transform: translateZ(34px);
    border-radius:16px;
    background: linear-gradient(160deg, var(--box-color-l), var(--box-color-d));
    box-shadow: 0 18px 30px -10px rgba(0,0,0,0.28);
    flex-direction:column;
    padding:20px 16px;
  }
  .face-side{
    width:68px;height:230px;
    left:0;top:0;
    transform: rotateY(90deg) translateZ(95px);
    background: linear-gradient(180deg, var(--box-color-d), #2a060e);
    border-radius:16px;
  }
  .face-top{
    width:190px;height:68px;
    left:0;top:0;
    transform: rotateX(90deg) translateZ(34px) translateY(-34px);
    background: linear-gradient(90deg, var(--box-color-l), var(--box-color-lighter));
    border-radius:16px;
  }
  .box-mark{
    width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(255,255,255,0.55);
    display:flex;align-items:center;justify-content:center;
    font-family:'Georgia', serif;font-style:italic;
    font-size:18px; color:#fff;
    margin-bottom:12px;
    background: rgba(255,255,255,0.12);
  }
  .box-name{
    font-family:'Georgia', serif;
    font-size:18px;
    color:#fff;
    font-weight:700;
    letter-spacing:0.01em;
    margin-bottom:8px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .box-tag{
    font-size:11px;
    line-height:1.5;
    color: rgba(255,255,255,0.88);
    letter-spacing:0.01em;
  }
  .box-divider{
    width:26px;height:1px;
    background: rgba(255,255,255,0.55);
    margin:8px 0;
  }

  /* fade transition between products */
  .box3d.switching .face-front,
  .box3d.switching .box-name,
  .box3d.switching .box-tag{ opacity:0; }
  .face-front, .box-mark, .box-name, .box-tag{
    transition: opacity .35s ease;
  }

  /* ---------- dots ---------- */
  .dots{
    display:flex;gap:7px;
  }
  .dot{
    width:6px;height:6px;border-radius:50%;
    background: var(--card-line);
    transition: all .3s ease;
  }
  .dot.active{
    background: var(--maroon);
    width:16px;border-radius:4px;
  }

  .footer{
    margin-top:16px;
    font-size:9.5px;
    letter-spacing:0.18em;
    color: var(--ink-soft);
    text-transform:uppercase;
    z-index:2;
  }
</style>
</head>
<body>
<div id="app">

  <div class="langbar" id="langbar">
    <button class="lang-btn" data-lang="uz">UZ</button>
    <button class="lang-btn" data-lang="en">ENG</button>
    <button class="lang-btn" data-lang="ru">RUS</button>
  </div>

  <div class="logo-wrap">
    <div class="logo-ring"><img src="logo.jpg" alt="ZYNEX PHARMA" /></div>
  </div>

  <div class="catalog-title" id="catalogTitle">Mahsulotlar katalogi</div>

  <div class="stage">
    <div class="stage-card">
      <div class="perspective">
        <div class="box3d" id="box3d">
          <div class="face face-front" id="faceFront">
            <div class="box-mark" id="boxMark">Z</div>
            <div class="box-name" id="boxName"></div>
            <div class="box-divider"></div>
            <div class="box-tag" id="boxTag"></div>
          </div>
          <div class="face face-side"></div>
          <div class="face face-top"></div>
        </div>
      </div>
      <div class="dots" id="dots"></div>
    </div>
  </div>

  <div class="footer">ZYNEX PHARMA &nbsp;&bull;&nbsp; O'zbekiston</div>
</div>

<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#ffffff');
      tg.setBackgroundColor('#ffffff');
    } catch(e){}
  }

  var products = [
    {
      key:'glat', mark:'G',
      color:['#7a2233','#4a121e','#8f2c3e'],
      name:{ uz:'«Глат»', ru:'«Глат»', en:'"Glat"' },
      tag:{
        uz:'Ginekologik intravaginal krem',
        ru:'Гинекологический интравагинальный крем',
        en:'Gynecological intravaginal cream'
      }
    },
    {
      key:'betrin', mark:'B',
      color:['#8a3420','#521e12','#a03f28'],
      name:{ uz:'Betrin', ru:'Бетрин', en:'Betrin' },
      tag:{
        uz:'Bolalar uchun sirop',
        ru:'Сироп для детей',
        en:'Syrup for children'
      }
    },
    {
      key:'rikalm', mark:'R',
      color:['#6e2246','#411430','#7e2b52'],
      name:{ uz:'Ri-Calm', ru:'Ри-Калм', en:'Ri-Calm' },
      tag:{
        uz:'Tinchlantiruvchi sirop',
        ru:'Успокаивающий сироп',
        en:'Calming syrup'
      }
    },
    {
      key:'demarol', mark:'D',
      color:['#5c1f38','#371226','#6b2542'],
      name:{ uz:'Demarol', ru:'Демарол', en:'Demarol' },
      tag:{
        uz:'Jigar va mikroflora uchun sirop',
        ru:'Сироп для печени и микрофлоры',
        en:'Syrup for liver and microflora'
      }
    },
    {
      key:'eklofor', mark:'E',
      color:['#7c2b3a','#4a1722','#8e3242'],
      name:{ uz:'Eklofor', ru:'Эклофор', en:'Eclofor' },
      tag:{
        uz:"Immunitet va temir darajasi uchun",
        ru:'Для иммунитета и уровня железа',
        en:'For immunity and iron level'
      }
    }
  ];

  var titles = {
    uz:'Mahsulotlar katalogi',
    ru:'Каталог продукции',
    en:'Product catalog'
  };

  var lang = 'uz';
  var idx = 0;
  var timer = null;

  var $box = document.getElementById('box3d');
  var $front = document.getElementById('faceFront');
  var $mark = document.getElementById('boxMark');
  var $name = document.getElementById('boxName');
  var $tag = document.getElementById('boxTag');
  var $dots = document.getElementById('dots');
  var $title = document.getElementById('catalogTitle');
  var $langbar = document.getElementById('langbar');

  function buildDots(){
    $dots.innerHTML = '';
    products.forEach(function(_, i){
      var d = document.createElement('div');
      d.className = 'dot' + (i === idx ? ' active' : '');
      $dots.appendChild(d);
    });
  }

  function render(){
    var p = products[idx];
    document.documentElement.style.setProperty('--box-color-l', p.color[0]);
    document.documentElement.style.setProperty('--box-color-d', p.color[1]);
    document.documentElement.style.setProperty('--box-color-lighter', p.color[2]);
    $mark.textContent = p.mark;
    $name.textContent = p.name[lang];
    $tag.textContent = p.tag[lang];
    $title.textContent = titles[lang];
    buildDots();
  }

  function next(){
    $box.classList.add('switching');
    setTimeout(function(){
      idx = (idx + 1) % products.length;
      render();
      $box.classList.remove('switching');
    }, 320);
  }

  function setLang(l){
    lang = l;
    Array.prototype.forEach.call($langbar.children, function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === l);
    });
    render();
  }

  $langbar.addEventListener('click', function(e){
    var btn = e.target.closest('.lang-btn');
    if (!btn) return;
    setLang(btn.getAttribute('data-lang'));
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.selectionChanged(); } catch(e){} }
  });

  setLang('uz');
  timer = setInterval(next, 3500);
})();
</script>
</body>
</html>
